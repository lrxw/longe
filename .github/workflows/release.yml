name: Release
# Actions → Release → "Run workflow": pick patch, minor or major. The job bumps the
# version in package.json, commits and tags it, packs the tarball and publishes a
# GitHub release. Nothing to do locally.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Bump the version, commit and tag
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="$(npm version "${{ inputs.bump }}" -m "chore: release %s")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Pack the tarball
        # longe-<version>.tgz for pinning, longe.tgz for the stable .../releases/latest/download/ URL
        run: |
          npm pack
          cp longe-*.tgz longe.tgz
      - name: Push the release commit and tag
        run: git push origin HEAD:${{ github.ref_name }} "${{ steps.bump.outputs.tag }}"
      - name: Create the GitHub release
        run: gh release create "$TAG" longe-*.tgz longe.tgz --title "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag }}

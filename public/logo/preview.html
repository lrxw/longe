<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>longe logo</title>
    <style>
      body {
        margin: 0;
        font: 14px ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: #f4f5f7;
        color: #1c1f24;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0f1115;
          color: #e5e7eb;
        }
        .tab {
          background: #2a303a;
        }
      }
      section {
        padding: 24px 32px;
      }
      .row {
        display: flex;
        align-items: end;
        gap: 28px;
        margin: 12px 0 28px;
      }
      h2 {
        font-size: 13px;
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        opacity: 0.7;
      }
      .tab {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 8px 8px 0 0;
        background: #dfe2e7;
      }
    </style>
  </head>
  <body>
    <!-- follows the system light/dark setting, like the app; switch it to see both -->
    <section>
      <h2>Wordmark in use (dashed "o")</h2>
      <div class="row">
        <img src="wordmark.svg" alt="longe" height="96" />
        <img src="wordmark.svg" alt="longe" height="40" />
        <img src="wordmark.svg" alt="longe" height="22" />
      </div>
      <h2>Candidate: solid "o" (wordmark-solid.svg)</h2>
      <div class="row">
        <img src="wordmark-solid.svg" alt="longe" height="96" />
        <img src="wordmark-solid.svg" alt="longe" height="40" />
        <img src="wordmark-solid.svg" alt="longe" height="22" />
      </div>
      <h2>Candidate: fading trail (wordmark-fade.svg)</h2>
      <div class="row">
        <img src="wordmark-fade.svg" alt="longe" height="96" />
        <img src="wordmark-fade.svg" alt="longe" height="40" />
        <img src="wordmark-fade.svg" alt="longe" height="22" />
      </div>
      <h2>Header size side by side (22px): in use · solid · fading</h2>
      <div class="row">
        <img src="wordmark.svg" alt="longe" height="22" />
        <img src="wordmark-solid.svg" alt="longe" height="22" />
        <img src="wordmark-fade.svg" alt="longe" height="22" />
      </div>
      <h2>Small logo and favicon: the "o" alone</h2>
      <div class="row">
        <img src="mark.svg" alt="longe" width="128" /><img src="mark.svg" alt="longe" width="64" />
        <img src="favicon.svg" alt="longe" width="32" />
        <img src="favicon.svg" alt="longe" width="16" />
        <span class="tab"><img src="mark.svg" alt="" width="16" /> centered</span>
        <span class="tab"><img src="favicon.svg" alt="" width="16" /> Inbox · longe</span>
      </div>
    </section>
  </body>
</html>

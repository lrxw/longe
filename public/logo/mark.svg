<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 8 48 48" role="img" aria-label="longe">
  <!--
    The small logo: the "o" of the wordmark on its own. An ink ring (the letters'
    color) with the lunge line and the runner in blue. The first, dashed version is
    mark-dashed.svg.
  -->
  <style>
    .ink { stroke: #1c1f24; }
    .accent { stroke: #2563eb; fill: #2563eb; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #e5e7eb; }
      .accent { stroke: #60a5fa; fill: #60a5fa; }
    }
  </style>
  <circle class="ink" cx="32" cy="32" r="18" fill="none" stroke-width="6.5"/>
  <g class="accent">
    <path d="M32 32 L44.73 19.27" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="32" cy="32" r="4.5" stroke="none"/>
    <circle cx="44.73" cy="19.27" r="7" stroke="none"/>
  </g>
</svg>

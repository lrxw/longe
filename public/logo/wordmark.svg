<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 64" role="img" aria-label="longe">
  <!--
    Wordmark. The letters are stroke paths on one grid (stroke 6, x-height 24..48).
    The "o" ring is in the letters' ink, so the word reads as one; only the lunge line
    and the runner are blue, the longe story in color. Chosen on 2026-09-23 from the
    candidates in preview.html; the first, dashed version is wordmark-dashed.svg.
  -->
  <style>
    .ink { stroke: #1c1f24; }
    .accent { stroke: #2563eb; fill: #2563eb; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #e5e7eb; }
      .accent { stroke: #60a5fa; fill: #60a5fa; }
    }
  </style>
  <g class="ink" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 8 V48"/>
    <path d="M52 48 V24 M52 34 A10 10 0 0 1 72 34 V48"/>
    <circle cx="96" cy="36" r="12"/>
    <path d="M108 24 V50 A10 10 0 0 1 98 60 H91"/>
    <path d="M120 36 H144 A12 12 0 1 0 140.49 44.49"/>
  </g>
  <g transform="translate(5.96 12.96) scale(0.72)">
    <circle class="ink" cx="32" cy="32" r="18" fill="none" stroke-width="6.5"/>
    <g class="accent">
      <path d="M32 32 L44.73 19.27" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="32" cy="32" r="4.5" stroke="none"/>
      <circle cx="44.73" cy="19.27" r="7" stroke="none"/>
    </g>
  </g>
</svg>
